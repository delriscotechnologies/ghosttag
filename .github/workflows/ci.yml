name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet and build
        run: |
          go vet ./...
          go build -trimpath -o /tmp/ghosttag ./cmd/ghosttag

      - name: Smoke test
        run: |
          printf '%s' '' | base64 -d > /tmp/sample.png
          /tmp/ghosttag /tmp/sample.png | tee /tmp/report.txt
          grep -q 'Detected format: PNG' /tmp/report.txt
          grep -q 'Categories found (4): capture time, device, authorship, comments' /tmp/report.txt
